# The main configuration of the base image includes this file in its http block.

# nginx runs as an unprivileged user, so its temporary files go to /tmp instead of the root-owned /var/cache/nginx. With
# a read-only root file system, mount a tmpfs at /tmp.
client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

server_tokens off;

server {
    # An unprivileged user cannot bind to ports below 1024, so the image needs no added capabilities.
    listen 4200;
    listen [::]:4200;

    root /usr/share/nginx/html;

    # Redirect a directory without its trailing slash, such as the base path, relative to the host that the client asked
    # for, since a proxy in front of the container may serve it under another host and port.
    absolute_redirect off;

    # Every response carries the headers of security-headers.inc, so each location below that adds a header of its own
    # includes the file again.
    include /etc/nginx/security-headers.inc;

    # The HEALTHCHECK of the Dockerfile probes this path. It sits outside the base path, so every image answers on the
    # same URL, and stays out of the access log, which would otherwise log a probe every few seconds.
    location = /healthz {
        access_log off;
        return 200;
    }

    # The Dockerfile writes the base path of the app in place of each @BASE_HREF@. The build prerenders the base path
    # into index.html, which $uri/ serves. Every other path under the base path that matches no file renders in the
    # browser, so it falls back to the app shell, index.csr.html, for the router.
    location @BASE_HREF@ {
        try_files $uri $uri/ @BASE_HREF@index.csr.html;
    }

    # A path with a file extension names a file, so a missing one, such as a bundle of an older build, returns 404.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    # Both HTML files name the hashed bundles of each build, so browsers revalidate them to load a new release. They also
    # carry the Content Security Policy, which csp.inc describes. sub_filter drops the ETag and Last-Modified of a
    # response, so browsers fetch the HTML in full on each visit.
    location = @BASE_HREF@index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/csp.inc;
        include /etc/nginx/security-headers.inc;
    }

    location = @BASE_HREF@index.csr.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/csp.inc;
        include /etc/nginx/security-headers.inc;
    }

    # build-info.json reports the build that runs, so neither browsers nor proxies may store it.
    location = @BASE_HREF@build-info.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.inc;
    }
}
